<!DOCTYPE html>
<html>
<head>
  <title>Morphing Matter</title>
  <link rel="stylesheet" type="text/css" href="/css/style.css" />
</head>
<body>
  <div class="container">
    <div class="header">
        <span>
          <h1 >Morphing Matter</h1>
        </span>
      </div>
    <div id="grid" class="grid">
      
      <div class="none"></div>
      <div id="centerDiv" class="content">
        <div class="card square">
          <svg id="svgContainer" viewBox="0 0 200 200"></svg>
        </div>
      </div>

      <div class="menu">
        <div class="card">
          <div>
            <div id="cursorPosition">Connecting...</div>
            <br><br>
            <label for="mode">Choose a mode:</label>
            <select name="mode" id="mode" onchange="setMode(this.value)">
              <option value="release">Release</option>
              <option value="static">Static</option>
              <option value="pull">Pull</option>
              <option value="push">Push</option>
              <option value="ripple">Ripple</option>
            </select>
            <br><br>
            <label for="volume">Volume:</label>
            <input id="volume" type="range" min="0.0" max="1" value="0.5" class="slider" step=0.02 id="volume" onchange="setVolume(this.value)">
            <br><br>
            <label for="speed">Animation speed:</label>
            <input id="speed" type="range" min="0.1" max="3" value="1" class="slider" step=0.02 id="speed" onchange="setSpeed(this.value)">
            <br><br>
            <label for="strength">Animation strength:</label>
            <input id="strength" type="range" min="0.1" max="2" value="1" class="slider" step=0.02 id="strength" onchange="setStrength(this.value)">
            <br><br>
            <label for="size">Animation size:</label>
            <input id="size" type="range" min="0.1" max="5" value="3" class="slider" step=0.02 id="size" onchange="setSize(this.value)">
            <br><br>
            <label for="isHold">Hold animation:</label>
            <input id="isHold" type="checkbox" onchange="setHold(this.checked)">
            <br><br>
            <label for="maxSpeed">Max actuator speed:</label>
            <input id="maxSpeed" value="0.2" id="maxSpeed" onchange="setMaxSpeed(this.value)">
            <br><br>
            <label for="equalisation">Equalisation:</label>
            <input id="equalisation" type="range" min="0.0" max="1" value="0.5" class="slider" step=0.02 id="equalisation" onchange="setEqualisation(this.value)">
            <br><br>
            <label for="scale">Actuator scale:</label>
            <input id="scale" type="range" min="0.1" max="2" value="0.3" class="slider" step=0.02 id="scale" onchange="setScale(this.value)">
          </div>
        </div>
      </div>
    </div>
    <button id="settings-button" onclick="toggleMenu()">Settings</button>

    <script src="/js/script.js"></script>
  </div>
</body>
</html>
